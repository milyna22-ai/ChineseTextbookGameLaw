<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>大漢廷尉：中渭橋驚魂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="改編自《史記・張釋之馮唐列傳》〈張釋之執法〉的 3D 法庭推理與動作冒險遊戲">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：全螢幕 3D 畫布；上方漆盒狀態列，下方原文字幕與對話如竹簡展開；色彩取自漢代漆器（黑漆、朱砂）、青銅（銅金、銅綠）與竹簡 */
:root {
  --lacquer: #1a110c; --lacquer-2: #2a1a11; --lacquer-3: #3b2517;
  --cinnabar: #b13a20; --cinnabar-2: #d65a3c;
  --bronze: #c99d55; --bronze-2: #ecd096;
  --verdigris: #5d9884; --verdigris-2: #93c9b3;
  --bamboo: #e8d5a5; --bamboo-2: #cdb27a; --ink: #23160d;
  --paper: #f4e8cd; --muted: #b9a689;
  --danger: #e2553a; --good: #7cc4a2;
  --scrim: rgba(18, 11, 7, .78);
  --font-display: "Cactus Classical Serif", "Noto Serif TC", "Noto Serif CJK TC", "Songti TC", "PMingLiU", serif;
  --font-body: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "Noto Serif TC", "Noto Serif CJK TC", serif;
  --font-ui: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: calc(env(safe-area-inset-top, 0px) + 10px);
  --gb: calc(env(safe-area-inset-bottom, 0px) + 14px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--lacquer); color: var(--paper); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
#ui, .modal, #title, #pause { touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--bronze-2); outline-offset: 3px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--lacquer); }
#ui { position: fixed; inset: 0; pointer-events: none; padding-left: var(--gl); padding-right: var(--gr); padding-block: 0; z-index: 4; }
#lb.on ~ #ui #sub { bottom: calc(9vh + 10px); }
#lb.on ~ #ui #dlg { bottom: calc(9vh + 6px); }
body.dlg-on #lb.on ~ #ui #sub { bottom: calc(9vh + var(--dlgH, 150px) + 12px); }
#ui > * { pointer-events: auto; }
#ui > .passive { pointer-events: none; }

/* ---- 頂部狀態列 ---- */
#hud { position: absolute; top: 0; left: var(--gl); right: var(--gr); padding-top: var(--gt); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; pointer-events: none; }
#hud > * { pointer-events: auto; }
.chap { display: flex; flex-direction: column; gap: 2px; min-width: 0; justify-self: start; padding: 5px 12px 6px; background: linear-gradient(90deg, rgba(18,11,7,.72), rgba(18,11,7,.35)); border-left: 3px solid var(--cinnabar); border-radius: 2px; }
.chap b { font-family: var(--font-display); font-weight: 400; font-size: clamp(17px, 2.4vw, 22px); letter-spacing: .12em; color: var(--bamboo); text-shadow: 0 2px 6px rgba(0,0,0,.7); }
.chap span { font-family: var(--font-ui); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-shadow: 0 1px 4px rgba(0,0,0,.9); }
#obj { grid-column: 1 / -1; justify-self: start; max-width: min(560px, 100%); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; padding: 7px 12px 7px 30px; background: var(--scrim); border: 1px solid rgba(201,157,85,.45); border-radius: 3px; position: relative; color: var(--paper); }
#obj:empty { display: none; }
#obj::before { content: ""; position: absolute; left: 11px; top: 50%; width: 9px; height: 9px; margin-top: -5px; background: var(--cinnabar-2); transform: rotate(45deg); box-shadow: 0 0 8px var(--cinnabar-2); }
.hudbtns { display: flex; gap: 8px; grid-column: 2; grid-row: 1; }
.ibtn { width: 44px; height: 44px; display: grid; place-items: center; background: var(--scrim); border: 1px solid rgba(201,157,85,.55); border-radius: 50%; color: var(--bamboo); padding: 0; }
.ibtn svg { width: 22px; height: 22px; }
.ibtn:active { transform: scale(.94); }

/* ---- 辯論量表 ---- */
#meters { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--gt) + 56px); width: min(520px, calc(100% - var(--gl) - var(--gr))); display: grid; gap: 7px; pointer-events: none; }
.meter { display: grid; grid-template-columns: 5.6em minmax(0, 1fr) 2.6em; align-items: center; gap: 8px; font-family: var(--font-ui); font-size: 13px; color: var(--paper); text-shadow: 0 1px 3px #000; }
.meter .bar { height: 12px; background: rgba(10,6,4,.75); border: 1px solid rgba(201,157,85,.5); border-radius: 2px; overflow: hidden; position: relative; }
.meter .fill { position: absolute; inset: 0 auto 0 0; width: 50%; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.meter.anger .fill { background: linear-gradient(90deg, #7d1e10, var(--danger)); }
.meter.heart .fill { background: linear-gradient(90deg, #2f5f50, var(--good)); }
.meter.anger.hot .bar { box-shadow: 0 0 12px var(--danger); animation: throb .6s infinite alternate; }
.meter .num { text-align: right; font-variant-numeric: tabular-nums; }
.bump { position: absolute; font-family: var(--font-ui); font-weight: 700; font-size: 15px; pointer-events: none; animation: bump 1.2s ease-out forwards; text-shadow: 0 1px 3px #000; }
@keyframes bump { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-26px); } }
@keyframes throb { from { filter: brightness(1); } to { filter: brightness(1.5); } }

/* ---- 倒數計時 ---- */
#timer { position: absolute; top: calc(var(--gt) + 4px); left: 50%; transform: translateX(-50%); width: 74px; height: 74px; display: grid; place-items: center; pointer-events: none; }
#timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
#timer circle { fill: rgba(18,11,7,.8); stroke: rgba(201,157,85,.3); stroke-width: 5; }
#timer circle.arc { fill: none; stroke: var(--danger); stroke-linecap: round; stroke-dasharray: 201; transition: stroke-dashoffset .2s linear; }
#timer b { font-family: var(--font-ui); font-size: 26px; font-variant-numeric: tabular-nums; color: var(--paper); position: relative; line-height: 1; }
#timer span { position: absolute; bottom: -18px; font-family: var(--font-ui); font-size: 11px; letter-spacing: .1em; color: var(--bamboo); white-space: nowrap; text-shadow: 0 1px 3px #000; }

#clueBar { position: absolute; top: calc(var(--gt) + 4px); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 6px 12px; background: var(--scrim); border: 1px solid rgba(201,157,85,.45); border-radius: 3px; font-family: var(--font-ui); font-size: 13px; pointer-events: none; }
#clueBar i { width: 14px; height: 14px; border: 1px solid var(--bronze); transform: rotate(45deg); display: inline-block; margin: 0 3px; }
#clueBar i.got { background: var(--bronze-2); box-shadow: 0 0 8px var(--bronze-2); }

/* ---- 原文字幕 ---- */
#sub { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--gb) + 8px); width: min(880px, calc(100% - var(--gl) - var(--gr))); text-align: center; pointer-events: none; display: grid; gap: 6px; justify-items: center; }
#sub:not([hidden]) { animation: subIn .45s cubic-bezier(.2,.9,.2,1) both; }
@keyframes subIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
#sub .cl { font-family: var(--font-display); font-size: clamp(24px, 4.4vw, 42px); letter-spacing: .14em; color: var(--bamboo); text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 18px rgba(0,0,0,.9); line-height: 1.35; text-wrap: balance; }
#sub .cl em { font-style: normal; color: var(--cinnabar-2); }
#sub .cl .yuanwen { display: table; margin: 0 auto 6px; font-size: 11px; line-height: 1.6; letter-spacing: .3em; text-shadow: none; }
#sub .md { font-family: var(--font-body); font-size: clamp(14px, 2vw, 18px); color: var(--paper); background: var(--scrim); padding: 5px 14px; border-radius: 2px; line-height: 1.6; max-width: 100%; }
#sub .md:empty, #sub .gl:empty { display: none; }
#sub .gl { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.gloss { font-family: var(--font-ui); font-size: 13px; padding: 3px 9px; background: rgba(36,22,13,.88); border: 1px solid var(--bronze); color: var(--bamboo); border-radius: 2px; }
.gloss b { color: var(--bronze-2); font-weight: 700; margin-right: 4px; }
.yuanwen { font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .12em; color: var(--lacquer); background: var(--bamboo-2); padding: 1px 6px; border-radius: 1px; }

/* ---- 對話框 ---- */
#dlg { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--gb); width: min(820px, calc(100% - var(--gl) - var(--gr))); min-height: 112px; padding: 26px 22px 18px; background: linear-gradient(180deg, rgba(43,27,18,.96), rgba(26,17,12,.97)); border: 1px solid rgba(201,157,85,.6); box-shadow: inset 0 0 0 4px rgba(26,17,12,.9), inset 0 0 0 5px rgba(201,157,85,.25), 0 10px 30px rgba(0,0,0,.6); border-radius: 3px; cursor: pointer; }
#dlg .who { position: absolute; top: -15px; left: 18px; padding: 4px 14px; background: var(--cinnabar); color: var(--paper); font-family: var(--font-display); font-size: 17px; letter-spacing: .16em; border: 1px solid var(--bronze); box-shadow: 0 3px 8px rgba(0,0,0,.5); }
#dlg .who:empty { display: none; }
#dlg .txt { font-size: clamp(16px, 2.2vw, 20px); line-height: 1.75; color: var(--paper); min-height: 2.2em; }
#dlg .txt .cl { display: block; font-family: var(--font-display); color: var(--bamboo); letter-spacing: .08em; margin-bottom: 4px; }
#dlg .txt .think { color: var(--muted); }
#dlg .more { position: absolute; right: 16px; bottom: 8px; color: var(--bronze); font-size: 13px; animation: nudge 1s infinite; font-family: var(--font-ui); }
@keyframes nudge { 50% { transform: translateY(3px); opacity: .6; } }

/* ---- 選項卡 ---- */
#choices { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--gb); width: min(680px, calc(100% - var(--gl) - var(--gr))); display: grid; gap: 10px; }
#choices .q { font-family: var(--font-body); font-size: clamp(16px, 2.2vw, 19px); text-align: center; color: var(--bamboo); text-shadow: 0 2px 6px #000; padding: 0 4px 4px; line-height: 1.6; text-wrap: balance; }
#choices .list { display: grid; gap: 9px; }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 12px 14px; background: linear-gradient(180deg, rgba(48,30,20,.95), rgba(28,18,12,.96)); border: 1px solid rgba(201,157,85,.5); border-radius: 3px; color: var(--paper); transition: border-color .15s, transform .15s, background .15s; }
.opt:hover { border-color: var(--bronze-2); transform: translateY(-1px); }
.opt .n { width: 30px; height: 30px; display: grid; place-items: center; background: var(--cinnabar); color: var(--paper); font-family: var(--font-display); font-size: 17px; border-radius: 2px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); }
.opt .t { font-size: clamp(15px, 2.1vw, 18px); line-height: 1.55; }
.opt .t small { display: block; font-family: var(--font-ui); font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.opt.cl .t { font-family: var(--font-display); letter-spacing: .06em; color: var(--bamboo); }
.opt.picked { border-color: var(--bronze-2); background: linear-gradient(180deg, rgba(120,70,30,.95), rgba(60,34,18,.96)); }
.opt.wrong { animation: shake .4s; border-color: var(--danger); }
.opt[disabled] { opacity: .45; cursor: default; transform: none; }
.opt.right[disabled], .opt.picked[disabled] { opacity: 1; }
.qopts .opt.wrong[disabled] { opacity: .85; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

/* ---- 動作鈕 ---- */
#act { position: absolute; right: var(--gr); bottom: calc(var(--gb) + 6px); width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--bronze-2); background: radial-gradient(circle at 35% 30%, var(--cinnabar-2), var(--cinnabar) 55%, #6e1f10); color: var(--paper); font-family: var(--font-display); font-size: 21px; letter-spacing: .1em; box-shadow: 0 6px 18px rgba(0,0,0,.55), 0 0 0 6px rgba(201,157,85,.18); display: grid; place-items: center; padding: 0; line-height: 1.1; }
#act::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--bronze-2); animation: ring 1.4s infinite; opacity: 0; }
#act.dim { filter: grayscale(.7) brightness(.7); }
#act.dim::after { display: none; }
#act span { max-width: 4.2em; text-align: center; }
#act kbd { position: absolute; bottom: -20px; font-family: var(--font-ui); font-size: 11px; color: var(--muted); letter-spacing: .05em; }
@keyframes ring { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }

/* ---- 虛擬搖桿 ---- */
#joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(232,213,165,.45); background: rgba(18,11,7,.35); pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 5; }
#joy.on { opacity: 1; }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--bronze-2), var(--bronze) 60%, #7b5a2a); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,.6); }
#joyHint { position: fixed; left: calc(var(--gl) + 18px); bottom: calc(var(--gb) + 18px); width: 104px; height: 104px; border-radius: 50%; border: 2px dashed rgba(232,213,165,.35); display: none; place-items: center; font-family: var(--font-ui); font-size: 12px; color: rgba(232,213,165,.7); pointer-events: none; text-align: center; line-height: 1.4; }
body.can-move #joyHint { display: grid; }
body.can-move #joy.on ~ #joyHint { display: none; }

/* ---- 大字、提示、吐司 ---- */
#big { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
#big div { font-family: var(--font-display); font-size: clamp(56px, 15vw, 168px); line-height: 1.1; letter-spacing: .08em; color: var(--bamboo); text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 40px rgba(0,0,0,.85); animation: inkIn .9s cubic-bezier(.2,.9,.2,1) both; padding: 0 .2em; }
#big div.red { color: var(--cinnabar-2); }
#big div.small { font-size: clamp(30px, 7vw, 64px); }
#big div small { display: block; font-size: .28em; letter-spacing: .3em; color: var(--paper); margin-top: .5em; }
#big div.out { animation: inkOut .6s ease-in both; }
@keyframes inkIn { from { opacity: 0; transform: scale(1.35); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes inkOut { to { opacity: 0; transform: scale(.96); filter: blur(6px); } }
#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--gb) + 128px); font-family: var(--font-ui); font-size: 13.5px; color: var(--paper); background: var(--scrim); padding: 7px 14px; border-radius: 3px; border: 1px solid rgba(201,157,85,.3); max-width: min(560px, calc(100% - var(--gl) - var(--gr))); text-align: center; line-height: 1.5; pointer-events: none; transition: opacity .3s; }
#hint:empty { opacity: 0; padding: 0; border: 0; }
#toast { position: absolute; right: var(--gr); top: calc(var(--gt) + 56px); display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.tst { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; padding: 9px 14px 9px 10px; background: linear-gradient(180deg, rgba(48,30,20,.97), rgba(26,17,12,.97)); border: 1px solid var(--bronze); border-radius: 3px; animation: tIn .5s cubic-bezier(.2,.9,.2,1) both; max-width: 300px; box-shadow: 0 8px 20px rgba(0,0,0,.5); }
.tst .seal { width: 40px; height: 40px; background: var(--cinnabar); color: var(--paper); display: grid; place-items: center; font-family: var(--font-display); font-size: 13px; line-height: 1.05; text-align: center; border-radius: 2px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
.tst b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--bamboo); letter-spacing: .1em; }
.tst span { font-family: var(--font-ui); font-size: 12px; color: var(--muted); }
.tst.out { animation: tOut .4s ease-in both; }
@keyframes tIn { from { opacity: 0; transform: translateX(30px); } }
@keyframes tOut { to { opacity: 0; transform: translateX(30px); } }

/* ---- 3D 標記 ---- */
#marks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.mk { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: grid; justify-items: center; gap: 2px; font-family: var(--font-ui); font-size: 12.5px; color: var(--paper); text-shadow: 0 1px 3px #000; white-space: nowrap; will-change: transform; }
.mk .dia { width: 16px; height: 16px; border: 2px solid var(--bronze-2); background: rgba(201,157,85,.35); transform: rotate(45deg); box-shadow: 0 0 10px var(--bronze-2); animation: bob 1.4s ease-in-out infinite; }
.mk.goal .dia { border-color: var(--cinnabar-2); background: rgba(214,90,60,.45); box-shadow: 0 0 12px var(--cinnabar-2); }
.mk .lbl { background: rgba(18,11,7,.75); padding: 2px 7px; border-radius: 2px; }
.mk.edge .lbl { display: none; }
.mk .arr { display: none; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 15px solid var(--bronze-2); filter: drop-shadow(0 0 4px #000); }
.mk.edge .arr { display: block; }
.mk.edge .dia { display: none; }
.mk.goal .arr { border-bottom-color: var(--cinnabar-2); }
.bubble { position: absolute; transform: translate(-50%, -100%); background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; padding: 6px 10px; border-radius: 10px; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,.4); animation: tIn .3s both; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -6px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--paper); }
.pick3d { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; padding: 8px 14px; font-family: var(--font-display); font-size: 17px; letter-spacing: .1em; color: var(--bamboo); background: rgba(26,17,12,.88); border: 1px solid var(--bronze); border-radius: 3px; white-space: nowrap; box-shadow: 0 0 14px rgba(201,157,85,.35); }
.pick3d small { display: block; font-family: var(--font-ui); font-size: 11.5px; letter-spacing: .04em; color: var(--muted); }
.pick3d:hover { border-color: var(--bronze-2); color: var(--paper); }

/* ---- 全螢幕效果 ---- */
#vig { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s; background: radial-gradient(ellipse at center, transparent 45%, rgba(10,6,3,.85) 100%); }
#vig.eye { opacity: 1; background: radial-gradient(ellipse at center, transparent 50%, rgba(20,40,52,.55) 85%, rgba(8,16,22,.85) 100%); box-shadow: inset 0 0 0 3px rgba(147,201,179,.25); }
#vig.dark { opacity: 1; }
#vig.danger { opacity: 1; background: radial-gradient(ellipse at center, transparent 40%, rgba(120,20,8,.6) 100%); animation: throb .8s infinite alternate; }
#lb i { position: fixed; left: 0; right: 0; height: 0; background: #000; transition: height .6s cubic-bezier(.4,0,.2,1); pointer-events: none; z-index: 3; }
#lb i:first-child { top: 0; } #lb i:last-child { bottom: 0; }
#lb.on i { height: 9vh; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .5s; z-index: 20; }
#fade.on { pointer-events: auto; }
#flash { position: fixed; inset: 0; background: #fff4dc; opacity: 0; pointer-events: none; z-index: 19; }
#flash.go { animation: flash .5s ease-out; }
#flash.red { background: #ff5a30; }
@keyframes flash { from { opacity: .85; } to { opacity: 0; } }

/* ---- 面板（卷宗、竹簡、結算） ---- */
#pause, #title, #loading, .modal { position: fixed; inset: 0; z-index: 12; }
.modal { z-index: 22; }
#pause { z-index: 24; }
.modal.top { z-index: 26; }
#loading { z-index: 30; }
.modal, #pause { display: grid; place-items: center; background: rgba(10,6,3,.62); padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--gr) calc(env(safe-area-inset-bottom, 0px) + 12px) var(--gl); }

// ===================== 01 ENGINE：數學、幾何、渲染 =====================

}

const Rig = {
  yaw: Math.PI, pitch: 0.3, dist: 7, h: 1.5, lastLook: -99, autoAlign: true, constrain: null,
  snap(player) { this.yaw = player.facing + Math.PI; this.place(player, 1); },
  place(player, k) {
    const tgt = [player.pos[0], player.pos[1] + this.h, player.pos[2]], d = this.dist;
    let cp = [tgt[0] + Math.sin(this.yaw) * Math.cos(this.pitch) * d, tgt[1] + Math.sin(this.pitch) * d, tgt[2] + Math.cos(this.yaw) * Math.cos(this.pitch) * d];
    if (this.constrain) cp = this.constrain(cp, tgt);
    cam.pos = v3.lerp(cam.pos, cp, k); cam.target = v3.lerp(cam.target, tgt, Math.min(1, k * 1.3));
  },
  update(dt, player) {
    const l = IN.takeLook();
    if (l[0] || l[1]) { this.yaw -= l[0] * 0.0065; this.pitch = clamp(this.pitch + l[1] * 0.004, 0.02, 1.05); this.lastLook = G.realTime; }
    if (this.autoAlign && player.moving && G.realTime - this.lastLook > 1.6) this.yaw = angLerp(this.yaw, player.facing + Math.PI, Math.min(1, dt * 1.1 * player.speedK));
    this.place(player, 1 - Math.exp(-dt * 7));
  },

// 依鏡頭方向把輸入轉成世界方向
function inputDir() {
  const [ix, iy] = IN.move(); if (!ix && !iy) return null;
  const s = Math.sin(Rig.yaw), c = Math.cos(Rig.yaw);
  const dx = -s * iy + c * ix, dz = -c * iy - s * ix, l = Math.hypot(ix, iy);
  return { x: dx / (Math.hypot(dx, dz) || 1), z: dz / (Math.hypot(dx, dz) || 1), k: l };
}

    const W = R.w, H = R.h;
    for (const a of this.anchors.values()) {
      const p = typeof a.pos === 'function' ? a.pos() : a.pos; if (!p) { a.e.style.display = 'none'; continue; }
      const s = cam.project(p);
      if (a.type !== 'mark') {
        if (s.behind || s.x < -50 || s.x > W + 50 || s.y < -50 || s.y > H + 50) { a.e.style.display = 'none'; continue; }
        a.e.style.display = ''; a.e.style.left = s.x + 'px'; a.e.style.top = s.y + 'px'; continue;
      }
      const pad = 44, top = 96;
      let x = s.x, y = s.y, edge = s.behind || x < pad || x > W - pad || y < top || y > H - pad, rot = 0;
      if (edge) {
        if (!a.o.edge) { a.e.style.display = 'none'; continue; }
        let dx = (s.behind ? -s.nx : s.nx) * W / 2, dy = -(s.behind ? -s.ny : s.ny) * H / 2;

        const t = Math.min((W / 2 - pad) / Math.max(1e-3, Math.abs(dx)), (H / 2 - pad - 30) / Math.max(1e-3, Math.abs(dy)));

      }
      a.e.style.display = ''; a.e.classList.toggle('edge', edge);
      a.e.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)` + (edge ? ` rotate(${rot}rad)` : '');
    }
  },
};

// ---------- 行走與碰撞 ----------
function walkResolve(w, nx, nz) {
  const ox = w.pos[0], oz = w.pos[2];
  nx = clamp(nx, -48, 48); nz = clamp(nz, -75, 102);
  let onDeck = w.onDeck, y;
  if (onDeck) {
    if (Math.abs(nz) > 28.15) onDeck = false; else { nx = clamp(nx, -3.4, 3.4); y = BW.DECK_Y; }
  } else if (Math.abs(nx) < 4.2 && Math.abs(nz) <= 28.15) {
    if (w.pos[1] > 3.55) { if (Math.abs(oz) <= 28.0 && Math.abs(ox) > 3.5) return false; onDeck = true; nx = clamp(nx, -3.4, 3.4); y = BW.DECK_Y; }
    else if (Math.abs(nz) > 24.5 || Math.abs(nx) > 3.95 && Math.abs(nz) > 23.5) return false;
  }
  if (!onDeck) {
    y = terrainH(nx, nz); if (y < 0.06) return false;
    for (const c of BW.colliders) {
      const dx = nx - c[0], dz = nz - c[1], d = Math.hypot(dx, dz), r = c[2] + 0.28;
      if (d < r) { if (d < 1e-4) return false; nx = c[0] + dx / d * r; nz = c[1] + dz / d * r; }
    }
    y = terrainH(nx, nz); if (y < 0.06) return false;
    if (Math.abs(nx) < 4.2 && Math.abs(nz) <= 28.15 && Math.abs(nz) > 24.5 && w.pos[1] < 3.55) return false;
  }
  w.pos[0] = nx; w.pos[2] = nz; w.onDeck = onDeck; w.ty = y; return true;
}
function groundAt(x, z, onDeck) { return onDeck && Math.abs(z) <= 28.15 && Math.abs(x) < 4 ? BW.DECK_Y : terrainH(x, z); }

// 角色控制器（玩家）
class Walker {
  constructor(person) { this.p = person; this.node = person.root; this.pos = [0, 0, 0]; this.facing = Math.PI; this.onDeck = false; this.vel = [0, 0]; this.moving = false; this.speedK = 0; this.ty = 0; this.stepAcc = 0; this.maxSpeed = 4.6; this.locked = false; }
  place(x, z, facing, onDeck = false) { this.pos = [x, groundAt(x, z, onDeck), z]; this.ty = this.pos[1]; this.onDeck = onDeck; if (facing !== undefined) this.facing = facing; this.vel = [0, 0]; this.sync(); }
  sync() { this.node.pos = [this.pos[0], this.pos[1], this.pos[2]]; this.node.rot[1] = this.facing; }
  update(dt) {
    const d = this.locked ? null : inputDir();
    const tv = d ? [d.x * this.maxSpeed * d.k, d.z * this.maxSpeed * d.k] : [0, 0];
    const k = 1 - Math.exp(-dt * (d ? 9 : 12)); this.vel[0] = lerp(this.vel[0], tv[0], k); this.vel[1] = lerp(this.vel[1], tv[1], k);
    const sp = Math.hypot(this.vel[0], this.vel[1]); this.moving = sp > 0.3; this.speedK = clamp(sp / this.maxSpeed, 0, 1);
    if (sp > 0.01) {
      const nx = this.pos[0] + this.vel[0] * dt, nz = this.pos[2] + this.vel[1] * dt;
      if (!walkResolve(this, nx, nz)) { if (!walkResolve(this, nx, this.pos[2])) { if (!walkResolve(this, this.pos[0], nz)) { this.vel = [0, 0]; } } }
      if (this.moving) this.facing = angLerp(this.facing, Math.atan2(this.vel[0], this.vel[1]), 1 - Math.exp(-dt * 12));
      this.stepAcc += sp * dt; if (this.stepAcc > (sp > 4.2 ? 1.25 : 0.95)) { this.stepAcc = 0; AU.step(this.onDeck ? 0.16 : 0.1); }
    }
    this.ty = groundAt(this.pos[0], this.pos[2], this.onDeck);
    this.pos[1] = lerp(this.pos[1], this.ty, 1 - Math.exp(-dt * 16));
    this.p.update(dt, sp); this.sync();
    this.node.setShade(shadeAt([this.pos[0], this.pos[1] + 1, this.pos[2]]));
  }
}

// ---------- 車駕隊伍 ----------
class Convoy {
  constructor(sc) {
    this.root = sc.root.add(new Node());
    this.adv = { z: -60, speed: 0, members: [] };
    const lanes = [[-1.3, 0, { banner: TEX.banner }], [1.3, 0, { banner: TEX.banner }], [-1.3, -3.4, { halberd: true }], [1.3, -3.4, { halberd: true }], [-1.3, -6.8, { banner: TEX.bannerB, coat: 0x2e2620 }], [1.3, -6.8, { halberd: true, coat: 0x8a5a34 }]];
    for (const [ox, dz, o] of lanes) { const r = makeRider(o); this.root.add(r.root); this.adv.members.push({ r, ox, dz }); }
    this.imp = { z: -90, speed: 0, members: [] };
    this.car = new Carriage(); this.root.add(this.car.root);
    for (const [ox, dz, o] of [[-2.6, 2.5, { halberd: true }], [2.6, 2.5, { halberd: true }], [-2.6, -2.5, { banner: TEX.banner }], [2.6, -2.5, { banner: TEX.banner }]]) { const r = makeRider(o); this.root.add(r.root); this.imp.members.push({ r, ox, dz }); }
    this.hoofT = 0; this.visible = true;
  }
  setVisible(v) { this.root.visible = v; this.visible = v; }
  groupPos(gp, ox, dz) { const z = gp.z + dz; return [ox, groundAt(ox, z, Math.abs(z) < 28.15), z]; }
  update(dt, listener) {
    if (!this.visible) return;
    const near = [];
    for (const gp of [this.adv, this.imp]) {
      gp.z += gp.speed * dt;
      for (const m of gp.members) {
        const p = this.groupPos(gp, m.ox, m.dz); m.r.root.pos = p; m.r.root.rot[1] = 0; m.r.update(dt, gp.speed);
        m.r.root.setShade(shadeAt([p[0], p[1] + 1.4, p[2]])); near.push(p);
        if (gp.speed > 3 && Math.random() < dt * 9) BW.dust.emit([p[0] + rand(-0.4, 0.4), p[1] + 0.1, p[2] - 0.6], [rand(-0.6, 0.6), rand(0.5, 1.2), rand(-1.2, -0.3)], rand(1.2, 2.2), 0.8, 2.6, 0.55);
      }
    }
    const ip = this.groupPos(this.imp, 0, 0); this.car.root.pos = ip; this.car.speed = this.imp.speed; this.car.update(dt); this.car.root.setShade(shadeAt([ip[0], ip[1] + 1.4, ip[2]]));
    if (this.imp.speed > 3 && Math.random() < dt * 12) BW.dust.emit([rand(-1.2, 1.2), ip[1] + 0.1, ip[2] + rand(-1, 3)], [rand(-0.6, 0.6), rand(0.5, 1.2), rand(-1.5, -0.3)], rand(1.2, 2.4), 1.0, 3.2, 0.5);
    near.push(ip, v3.add(ip, [0, 0, 3]));
    // 馬蹄聲（依距離）
    const sp = Math.max(this.adv.speed, this.imp.speed);
    if (sp > 0.2 && listener) {
      this.hoofT -= dt; if (this.hoofT <= 0) {
        let dmin = 1e9; for (const p of near) dmin = Math.min(dmin, v3.dist(p, listener));
        const v = clamp(1.6 / (1 + dmin / 7), 0, 0.5); this.hoofT = sp > 4.5 ? 0.11 : 0.26;
        if (v > 0.015) { AU.hoof(v); if (sp > 4.5 && Math.random() < 0.5) AU.hoof(v * 0.7, 0.05); }
      }
    }
    this.near = near;
  }
  nearest(p) { let d = 1e9; for (const q of this.near || []) d = Math.min(d, v3.dist(q, p)); return d; }
}

  if (!dur) { cam.pos = c[0].slice(); cam.target = c[1].slice(); return Promise.resolve(); }
  const p0 = cam.pos.slice(), t0 = cam.target.slice();
  return tween(dur, k => { cam.pos = v3.lerp(p0, c[0], k); cam.target = v3.lerp(t0, c[1], k); });
}

function bridgeCamConstrain(cp, tgt) {
  const under = tgt[1] < 4.0;
  if (under) {
    if (Math.abs(cp[0]) < 4.8 && Math.abs(cp[2]) < 28.6) cp[1] = Math.min(cp[1], 3.75);
    if (Math.abs(cp[0]) < 4.3 && Math.abs(cp[2]) > 24.3 && Math.abs(cp[2]) < 28.4 && cp[1] < 4.2) cp[2] = Math.sign(cp[2]) * 24.3;
  } else if (Math.abs(cp[0]) < 4.3 && Math.abs(cp[2]) < 28.3 && cp[1] < 5.2) cp[1] = 5.2;
  cp[1] = Math.max(cp[1], terrainH(cp[0], cp[2]) + 0.45, 0.45);
  return cp;
}

function decal(g, x, z, yaw, w, l, onDeck, lift = 0.03) {
  const d = [Math.sin(yaw), Math.cos(yaw)], p = [Math.cos(yaw), -Math.sin(yaw)];
  const P = (a, b) => { const X = x + d[0] * a + p[0] * b, Z = z + d[1] * a + p[1] * b; return [X, groundAt(X, Z, onDeck) + lift, Z]; };
  const A = P(-l / 2, -w / 2), B = P(-l / 2, w / 2), C = P(l / 2, w / 2), D = P(l / 2, -w / 2), up = [0, 1, 0];
  g.triN(A, B, C, up, up, up, 0xffffff, [0, 0], [1, 0], [1, 1]); g.triN(A, C, D, up, up, up, 0xffffff, [0, 0], [1, 1], [0, 1]);
}
function trail(g, x0, z0, x1, z1, stride, side = 0.13, onDeck = false, jit = 0.05) {

}

async function sentenceGame(title, correct, extras, hint) {
  return pendPromise(res => {
    const tiles = shuffle([...correct, ...extras]); let pos = 0;
    const wrap = document.createElement('div');
    wrap.innerHTML = `<p class="note">${hint}</p><div class="sentence"><span class="ph">依序點選竹片，組出張釋之的論點</span></div><div class="pool">${tiles.map(t => `<button class="tile" data-t="${t}">${t}</button>`).join('')}</div><p class="note smsg" style="text-align:center;min-height:1.5em"></p>`;
    const m = UI.modal({ eyebrow: '論點組合', title, width: 720, body: wrap, btns: [] });
    const sent = wrap.querySelector('.sentence'), msg = wrap.querySelector('.smsg');
    wrap.querySelectorAll('.tile').forEach(b => b.onclick = () => {
      if (pos >= correct.length || b.classList.contains('used')) return;
      if (b.dataset.t === correct[pos]) {
        if (pos === 0) sent.innerHTML = ''; AU.pluck(['A3', 'C4', 'D4', 'E4', 'G4', 'A4'][pos % 6], 0, 0.5);
        const s = document.createElement('span'); s.textContent = b.dataset.t; sent.appendChild(s); b.classList.add('used'); pos++; msg.textContent = '';
        if (pos === correct.length) { AU.ok(); setTimeout(() => { m.close('ok'); res(); }, 900); }
      } else {
        mistake('tileErr'); AU.bad(); b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
        setAnger(D.anger + 3); msg.textContent = '這片竹簡接不上。想想張釋之的意思：法律不能因一時喜怒加重。';

    });
  });
}

        <div class="quizq">${q.q}</div><div class="qopts">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="n">${'一二三四'[k]}</span><span class="t">${o}</span></button>`).join('')}</div><p class="qexp" style="min-height:3em;margin:12px 0 0"></p><div class="qnext" style="text-align:right"></div>`;
      wrap.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const k = +b.dataset.k, ok = k === q.a; wrap.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add('right'); });
        if (ok) { score++; AU.ok(); } else { b.classList.add('wrong'); AU.bad(); }
        wrap.querySelector('.qexp').innerHTML = `<b style="color:${ok ? 'var(--good)' : 'var(--danger)'}">${ok ? '答對了！' : '再想想。'}</b>　${q.e}`;
        const nb = document.createElement('button'); nb.className = 'btn primary'; nb.textContent = i < 9 ? '下一題' : '看成績'; nb.onclick = () => { AU.click(); i++; if (i < 10) render(); else end(); };
        wrap.querySelector('.qnext').appendChild(nb); nb.focus({ preventScroll: true });
      });
    }
    function end() {
      G.save.quizBest = Math.max(G.save.quizBest || 0, score); Store.write(); if (score >= 9) unlock('bowen');
      const g = score >= 9 ? '甲上' : score >= 7 ? '甲' : score >= 5 ? '乙' : '丙';
      wrap.innerHTML = `<div class="grade"><div class="stamp">${g}</div><div class="stat"><span>本次答對：<b>${score} / 10</b></span><span>最佳紀錄：<b>${G.save.quizBest} / 10</b></span><span>${score >= 9 ? '博聞強記，字字精熟！' : '打開原文卷軸複習注釋，再挑戰一次。'}</span></div></div><div style="text-align:right"><button class="btn primary" id="qAgain">再挑戰一次</button></div>`;
      wrap.querySelector('#qAgain').onclick = () => { AU.click(); reset(); };
    }
    reset();
  });
}

// ---------- 暫停 ----------
function setPause(on) {
  if (!G.chapterId || G.chapterId === 'title') return;
  G.paused = on; UI.el.pause.hidden = !on;
  if (on) { $('#pSound').textContent = soundLabel(); $('#pQuality').textContent = '畫質：' + (maxPr() > 1.5 ? '高' : '標準'); if (!G.touch) $('#pResume').focus({ preventScroll: true }); }
}
function bindMenus() {
  $('#btnPause').onclick = () => { AU.click(); setPause(true); };
  $('#btnScroll').onclick = () => { AU.click(); openScroll(true); };
  $('#pResume').onclick = () => { AU.click(); setPause(false); };
  $('#pScroll').onclick = () => { AU.click(); openScroll(true); };
  $('#pHelp').onclick = () => { AU.click(); helpPanel(true); };
  $('#pSound').onclick = () => { AU.setOn(!AU.on); G.save.sound = AU.on; Store.write(); $('#pSound').textContent = soundLabel(); AU.click(); };
  $('#pQuality').onclick = () => { G.save.quality = maxPr() > 1.5 ? 'low' : 'high'; Store.write(); $('#pQuality').textContent = '畫質：' + (maxPr() > 1.5 ? '高' : '標準'); AU.click(); };
  $('#pRestart').onclick = () => { AU.click(); const c = CHAPTERS.find(x => x.id === G.chapterId); if (c) startChapter(c); };
  $('#pTitle').onclick = () => { AU.click(); UI.fadeNow(1); goTitle(); };
  $('#mStart').onclick = () => { AU.init(); AU.click(); startChapter(CHAPTERS[0]); };
  $('#mChap').onclick = () => { AU.init(); AU.click(); chapterSelect(); };
  $('#mQuiz').onclick = () => { AU.init(); AU.click(); quizFlow(); };
  $('#mScroll').onclick = () => { AU.init(); AU.click(); openScroll(false); };
  $('#mAch').onclick = () => { AU.init(); AU.click(); achPanel(); };
  $('#mHelp').onclick = () => { AU.init(); AU.click(); helpPanel(false); };
  $('#mSound').onclick = () => { AU.init(); AU.setOn(!AU.on); G.save.sound = AU.on; Store.write(); $('#mSound').textContent = soundLabel(); AU.click(); };
  IN.onKey = (k, e) => {
    if (k === 'escape') { const tops = document.querySelectorAll('.modal'); if (tops.length && !UI.ownedModals.has(tops[tops.length - 1])) { tops[tops.length - 1].remove(); if (G.chapterId !== 'title') G.paused = !UI.el.pause.hidden; return; } setPause(UI.el.pause.hidden); return; }
    if (G.paused || document.querySelector('.modal')) return;
    if (!UI.el.dlg.hidden && (k === 'enter' || k === ' ' || k === 'e')) { e.preventDefault(); UI.dlgAdvance(); return; }
    if (!UI.el.choices.hidden && /^[1-6]$/.test(k)) { const b = UI.el.choices.querySelectorAll('.opt')[+k - 1]; if (b && !b.disabled) b.click(); return; }
    if (!UI.el.act.hidden && (k === ' ' || k === 'e')) { e.preventDefault(); UI.fireAct(); }
  };
  IN.onTap = () => { if (!UI.el.dlg.hidden && !G.paused) UI.dlgAdvance(); };
  document.addEventListener('visibilitychange', () => { if (!AU.ctx) return; if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume(); });
}

// ---------- 主迴圈 ----------
let _last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, Math.max(0, (now - _last) / 1000)); _last = now; G.realTime += rdt;
  R.resize(maxPr());
  if (!G.paused) {
    const dt = rdt * G.timeScale * (G.speed || 1); G.time += dt; tickFlow(dt, rdt * (G.speed || 1));
    try { if (G.update) G.update(dt, rdt); } catch (e) { console.error(e); }
  }
  cam.shake = Math.max(0, cam.shake - rdt * 1.3);
  if (G.scene) R.render(G.scene, cam, G.time);
  UI.updateAnchors();
}
async function boot(data) {
  Store.load(); AU.on = G.save.sound !== false;
  UI.init();
  if (!R.init(document.getElementById('gl'))) {
    UI.el.loading.innerHTML = '<div class="nogl">這台裝置的瀏覽器沒有開啟 WebGL，無法顯示 3D 畫面。<br>請改用最新版的 Chrome、Edge 或 Safari，或在設定中開啟硬體加速。</div>'; return;
  }
  IN.init(); bindMenus();
  const cv = document.getElementById('gl');
  cv.addEventListener('webglcontextlost', e => { e.preventDefault(); });
  cv.addEventListener('webglcontextrestored', () => { location.reload(); });
  try { await Promise.race([document.fonts.load(`64px "Cactus Classical Serif"`), new Promise(r => setTimeout(r, 1800))]); } catch (e) { }
  try { initTextures(); initMats(); buildBridgeWorld(); }
  catch (e) { console.error(e); UI.el.loading.innerHTML = '<div class="nogl">3D 場景載入失敗，請重新整理頁面再試一次。</div>'; return; }
  R.resize(maxPr()); requestAnimationFrame(frame);
  UI.el.loading.classList.add('done'); setTimeout(() => UI.el.loading.remove(), 700);
  setTimeout(() => { try { buildStudy(); buildHall(); } catch (e) { console.error(e); } }, 1200);
  window.claude?.hot?.snapshot?.(() => ({ chapter: G.chapterId }));
  const ch = data && CHAPTERS.find(c => c.id === data.chapter);
  if (ch) startChapter(ch); else { UI.fadeNow(1); goTitle(); }
}
const start = data => { boot(data || {}); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
window.__game = { G, CHAPTERS, startChapter, goTitle, A1, A2, D, HL, ST, BW, UI, cam, setPause };

})();
</script>
